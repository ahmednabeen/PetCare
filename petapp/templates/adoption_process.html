{% extends "base.html" %}
{% load static %}

{% block title %}Adoption Process | PetCare{% endblock %}

{% block content %}

<section class="adoption-section">
    <div class="adoption-header">
        <h2>Adoption Process</h2>
        <h1>For adopt your perfect pet</h1>
        <p>Please fill out the form below to start your adoption journey.</p>
    </div>
    

    <form method="post" action="{% url 'adoption_process' %}" class="adoption-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="address" placeholder="Enter your address" required></textarea>
        </div>

        <div class="form-group">
            <label>Which pet do you want to adopt?</label>
            <input type="text" name="pet_name" placeholder="Pet name or ID">
        </div>

        <div class="form-group">
            <label>Why do you want to adopt a pet?</label>
            <textarea name="message" placeholder="Write a short message"></textarea>
        </div>

        <button type="submit" class="adopt-btn">Submit Application</button>
    </form>
</section>

{% endblock %}
